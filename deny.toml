# cargo deny check: уязвимости (RustSec), лицензии, дубли версий, источники пакетов.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa (Marvin attack) — только проверка подписи публичным ключом, см. .cargo/audit.toml.
  { id = "RUSTSEC-2023-0071", reason = "rsa используется openidconnect только для проверки подписи публичным ключом" },
  # crypto-bigint 0.5 (утечка по времени над секретными числами) — только проверка подписи публичным ключом,
  # см. .cargo/audit.toml.
  { id = "RUSTSEC-2026-0387", reason = "p256/p384 из openidconnect только проверяют подпись открытым ключом" },
  # basic-toml не поддерживается (не уязвимость): askama_derive 0.16.1 (последняя) читает им askama.toml при
  # компиляции, в бинарь не попадает; без функции config askama не находит шаблоны по пути. Снять, когда askama
  # сменит парсер.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml — только в proc-macro askama, читает конфиг при компиляции" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0",
]
# Крейты workspace (publish = false) — наш код, лицензия у них не указывается.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
