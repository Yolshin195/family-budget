# cargo deny check: уязвимости (RustSec), лицензии, дубли версий, источники пакетов.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa (Marvin attack) — только проверка подписи публичным ключом, см. .cargo/audit.toml.
  { id = "RUSTSEC-2023-0071", reason = "rsa используется openidconnect только для проверки подписи публичным ключом" },
  # zip — build-зависимость utoipa-swagger-ui, распаковывает только vendored-архив Swagger UI, см. .cargo/audit.toml.
  { id = "RUSTSEC-2026-0367", reason = "zip только в build.rs utoipa-swagger-ui, архив доверенный (vendored)" },
  { id = "RUSTSEC-2026-0368", reason = "zip только в build.rs utoipa-swagger-ui, архив доверенный (vendored)" },
  { id = "RUSTSEC-2026-0369", reason = "zip только в build.rs utoipa-swagger-ui, архив доверенный (vendored)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0",
]
# Крейты workspace (publish = false) — наш код, лицензия у них не указывается.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
