# cargo audit: принятые риски — с обоснованием и датой пересмотра.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin attack): утечка по времени при операциях с ПРИВАТНЫМ ключом RSA.
  # rsa приходит из openidconnect только для проверки подписи ID-токена ПУБЛИЧНЫМ ключом Rauthy;
  # приватных RSA-ключей в приложении нет (клиент Rauthy подписывает EdDSA). Пересмотреть: 2027-01.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0387 (crypto-bigint 0.5, ветвления в «постоянных по времени» операциях): утечка по времени при
  # арифметике над СЕКРЕТНЫМИ числами. Приходит из openidconnect 4.0.1 (последняя) через p256/p384 → elliptic-curve
  # 0.13; исправление есть только в 0.7.6 (elliptic-curve 0.14), а openidconnect требует p256/p384 ^0.13. openidconnect
  # берёт из них только VerifyingKey — проверку подписи ES256/ES384 открытым ключом из JWKS, секретов в ней нет.
  # Снять, когда openidconnect перейдёт на elliptic-curve 0.14. Пересмотреть: 2027-01.
  "RUSTSEC-2026-0387",
]
