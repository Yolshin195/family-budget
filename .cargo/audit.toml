# cargo audit: принятые риски — с обоснованием и датой пересмотра.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin attack): утечка по времени при операциях с ПРИВАТНЫМ ключом RSA.
  # rsa приходит из openidconnect только для проверки подписи ID-токена ПУБЛИЧНЫМ ключом Rauthy;
  # приватных RSA-ключей в приложении нет (клиент Rauthy подписывает EdDSA). Пересмотреть: 2027-01.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459 (libsqlite3-sys, CVE в SQLite): крейт есть только в Cargo.lock — sqlx вносит туда драйвер SQLite
  # даже без функции sqlite; в сборку он не попадает (cargo tree его не находит, cargo deny по реальному графу не
  # ругается). Исправление — libsqlite3-sys 0.39, а sqlx-sqlite 0.9.0 требует <0.38. Снять, когда sqlx поднимет
  # версию. Пересмотреть: 2027-01.
  "RUSTSEC-2026-0459",
]
