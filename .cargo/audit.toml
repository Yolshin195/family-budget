# cargo audit: принятые риски — с обоснованием и датой пересмотра.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin attack): утечка по времени при операциях с ПРИВАТНЫМ ключом RSA.
  # rsa приходит из openidconnect только для проверки подписи ID-токена ПУБЛИЧНЫМ ключом Rauthy;
  # приватных RSA-ключей в приложении нет (клиент Rauthy подписывает EdDSA). Пересмотреть: 2027-01.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0367/0368/0369 (zip 3.0.0: SUID-биты и симлинки при распаковке ЧУЖОГО архива).
  # zip — только build-зависимость utoipa-swagger-ui: build.rs распаковывает архив Swagger UI из крейта
  # utoipa-swagger-ui-vendored (crates.io, сверен по контрольной сумме из Cargo.lock). Недоверенных архивов
  # нет, в рантайм-бинарник zip не попадает. Исправления (zip >= 9) нет даже в utoipa-swagger-ui 10.0.1
  # (zip ^8.6). Пересмотреть: при выходе utoipa-swagger-ui на zip >= 9, не позже 2027-01.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
