# Сайт (site/, Zola): лендинг, блог (релизы, гайды, идеи), «О проекте», отзывы, правовые страницы — на трёх языках.
#
# - PR: проверка трёх языков (scripts/check_site.py), сборка, проверка внутренних ссылок. Внешние ссылки не
#   проверяются — CI не должен падать из-за чужого сайта.
# - main: то же + публикация на GitHub Pages. Адрес Pages подставляется в --base-url, поэтому сайт работает и в
#   подкаталоге (https://yolshin195.github.io/family-budget/). Один раз включить: Settings → Pages → Source: GitHub Actions.
# - Пока сайт живёт отдельно от приложения, он закрыт от индексации (config.toml: extra.preview = true).
# - Приложение этот workflow не трогает: образ собирает docker-publish.yml только при изменениях в crates/.
name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/check_site.py'
      - 'styles/app.css'
      - 'tailwind.config.cjs'
      - 'crates/app/static/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/check_site.py'
      - 'styles/app.css'
      - 'tailwind.config.cjs'
      - 'crates/app/static/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Публикации идут по очереди, новая не отменяет начатую (Pages этого не любит); проверки PR — отменяются.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOLA_VERSION: 0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Three languages, structure and links
        run: python3 scripts/check_site.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Zola
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zola.tgz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/zola.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zola.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Assets (CSS, icons, fonts)
        run: npm run site:assets

      - name: Pages address
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build
        working-directory: site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: zola build ${BASE_URL:+--base-url "$BASE_URL"}

      - name: Internal links
        working-directory: site
        run: zola check --skip-external-links

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: site/public

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
