# Проверки на каждый PR (ТЗ, раздел 13): тесты, линтеры, уязвимые зависимости (cargo audit, cargo deny),
# сканирование образа (Trivy), OWASP ZAP baseline — без предупреждений уровней High и Medium.
#
# - Линтеры — те же, что make lint: rustfmt и clippy (предупреждения — ошибки), shellcheck, actionlint, hadolint, ruff.
#   Версии линтеров скриптов — в Makefile; Rust — stable, как у тестов: новый clippy может найти новое, это
#   исправляется отдельным PR.
#
# - На main не запускается: тесты и сборку образа там делает docker-publish.yml (теги — только при зелёных тестах),
#   уже опубликованный образ раз в неделю проверяет security-scan.yml.
# - PR только с документацией (*.md, docs/, specs/) не запускает CI.
# - Новый пуш в PR отменяет незаконченный прогон: результат нужен только для последнего коммита.
# - Кэши пишет только main (docker-publish.yml), PR их лишь читает: записи с веток не вытесняют кэш main
#   из квоты 10 ГБ. Rust — общий ключ shared-key: test; слои образа — type=gha, scope docker-amd64.
name: ci

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Тесты SQL-адаптеров и миграций (техдолг #10, kernel::testing): каждый тест — в своей временной схеме.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fb_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Если база не поднялась, тесты на PostgreSQL падают на подключении, а не пропускаются.
      - run: cargo test --workspace --locked

  lint-rust:
    name: Lint (rustfmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Кэш тестов с main: из него берутся собранные proc-macro и build-скрипты; свой кэш не пишется.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: make lint-rust

  lint:
    name: Lint (shell, workflows, Dockerfile, Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make lint-scripts ENGINE=docker

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Готовый бинарник из GitHub Releases: rustsec/audit-check собирал cargo-audit из исходников (~2 мин).
      # Принятые риски — .cargo/audit.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Слои — из кэша main (без cache-to): зависимости Rust не пересобираются. Стадия runtime — всегда заново:
      # Trivy проверяет текущий apt-get upgrade, как в публикуемом образе, а не слой из старого кэша.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localhost/family-budget:latest
          cache-from: type=gha,scope=docker-amd64
          no-cache-filters: runtime
      # Закреплено по коммиту, а не по тегу: в марте 2026 теги trivy-action подменяли (CVE-2026-33634),
      # теги без «v» (0.28.0 и др.) из репозитория удалены. Renovate обновляет коммит вместе с версией.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: localhost/family-budget:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  zap:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Тот же образ, что в image, — параллельно на своём раннере; compose запускает его без пересборки
      # (localhost/family-budget:latest — образ сервиса app в compose.yaml).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localhost/family-budget:latest
          cache-from: type=gha,scope=docker-amd64
          no-cache-filters: runtime
      - name: Запуск приложения (PostgreSQL + Rauthy + приложение)
        run: |
          docker compose up -d --no-build
          wait_for() {
            for _ in $(seq 1 90); do curl -fs -o /dev/null "$1" && return 0; sleep 2; done
            echo "::error::$1 не ответил за 3 минуты"; return 1
          }
          wait_for http://localhost:8080/health
          # /health от Rauthy не зависит, а /auth/login (его обходит ZAP) сразу идёт в Rauthy за discovery:
          # пока Rauthy не поднялся, вход отвечает 500 и ZAP засчитывает Application Error Disclosure [90022].
          wait_for http://localhost:8443/auth/v1/.well-known/openid-configuration
          # Вход целиком (приложение → Rauthy по внутреннему адресу): 303 на страницу Rauthy, не 500.
          wait_for http://localhost:8080/auth/login
        env:
          APP_ENV: dev
          GUEST_DEMO: '1'
          # Сканируем то, что уходит в продакшен: Swagger UI (/docs) там запрещён (Config::validate).
          SWAGGER: '0'
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080/
          rules_file_name: .zap/rules.tsv
          # Формы name="demo" (POST /demo, сессии ещё нет) защищены проверкой Origin, а не токеном _csrf —
          # ZAP не ищет в них токен. Остальные формы проверяются как обычно (Absence of Anti-CSRF Tokens).
          cmd_options: '-z "-config rules.csrf.ignorelist=demo"'
          fail_action: true
          allow_issue_writing: false
      - name: Логи контейнеров
        if: failure()
        run: docker compose logs --no-color
