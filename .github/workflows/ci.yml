# Проверки на каждый PR (ТЗ, раздел 13): тесты, уязвимые зависимости (cargo audit, cargo deny),
# сканирование образа (Trivy), OWASP ZAP baseline — без предупреждений уровней High и Medium.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t family-budget:ci .
      # Закреплено по коммиту, а не по тегу: в марте 2026 теги trivy-action подменяли (CVE-2026-33634),
      # теги без «v» (0.28.0 и др.) из репозитория удалены. Renovate обновляет коммит вместе с версией.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: family-budget:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  zap:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Запуск приложения (PostgreSQL + Rauthy + приложение)
        run: |
          docker compose up -d --build
          wait_for() {
            for i in $(seq 1 90); do curl -fs -o /dev/null "$1" && return 0; sleep 2; done
            echo "::error::$1 не ответил за 3 минуты"; return 1
          }
          wait_for http://localhost:8080/health
          # /health от Rauthy не зависит, а /auth/login (его обходит ZAP) сразу идёт в Rauthy за discovery:
          # пока Rauthy не поднялся, вход отвечает 500 и ZAP засчитывает Application Error Disclosure [90022].
          wait_for http://localhost:8443/auth/v1/.well-known/openid-configuration
          # Вход целиком (приложение → Rauthy по внутреннему адресу): 303 на страницу Rauthy, не 500.
          wait_for http://localhost:8080/auth/login
        env:
          APP_ENV: dev
          GUEST_DEMO: '1'
          # Сканируем то, что уходит в продакшен: Swagger UI (/docs) там запрещён (Config::validate).
          SWAGGER: '0'
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080/
          rules_file_name: .zap/rules.tsv
          # Формы name="demo" (POST /demo, сессии ещё нет) защищены проверкой Origin, а не токеном _csrf —
          # ZAP не ищет в них токен. Остальные формы проверяются как обычно (Absence of Anti-CSRF Tokens).
          cmd_options: '-z "-config rules.csrf.ignorelist=demo"'
          fail_action: true
          allow_issue_writing: false
      - name: Логи контейнеров
        if: failure()
        run: docker compose logs --no-color
