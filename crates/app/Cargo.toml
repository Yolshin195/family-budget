[package]
name = "family_budget"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kernel.workspace = true
anyhow.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
async-trait.workspace = true
axum.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
# Крейты фич. Блок ведёт arch.py.
# @arch:deps:begin
projects = { path = "../features/projects", optional = true }
currencies = { path = "../features/currencies", optional = true }
rates = { path = "../features/rates", optional = true }
accounts = { path = "../features/accounts", optional = true }
categories = { path = "../features/categories", optional = true }
places = { path = "../features/places", optional = true }
transactions = { path = "../features/transactions", optional = true }
limits = { path = "../features/limits", optional = true }
planning = { path = "../features/planning", optional = true }
budget = { path = "../features/budget", optional = true }
site = { path = "../features/site", optional = true }
mcp = { path = "../features/mcp", optional = true }
# @arch:deps:end

[features]
# Включённые фичи = default. Блок ведёт arch.py.
# @arch:features:begin
default = ["projects", "currencies", "rates", "accounts", "categories", "places", "transactions", "limits", "planning", "budget", "seed", "site", "mcp"]
projects = ["dep:projects", "currencies", "categories"]
currencies = ["dep:currencies"]
rates = ["dep:rates", "currencies"]
accounts = ["dep:accounts", "currencies"]
categories = ["dep:categories"]
places = ["dep:places", "accounts", "categories"]
transactions = ["dep:transactions", "accounts", "categories"]
limits = ["dep:limits", "categories"]
planning = ["dep:planning", "transactions", "rates"]
budget = ["dep:budget", "transactions", "planning", "limits", "rates"]
site = ["dep:site"]
mcp = ["dep:mcp", "projects", "currencies", "accounts", "categories", "places", "rates", "limits", "transactions", "budget", "planning"]
# @arch:features:end
# Демо-данные при пустой БД (не фича предметной области — флаг приложения).
seed = ["budget"]
