<!doctype html>
<html lang="{{ lang.code() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block fulltitle %}{% block title %}{% endblock %} · {{ self.t("app.title") }}{% endblock %}</title>
  {% block meta %}<meta name="robots" content="noindex">{% endblock %}
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4338ca">
  <link rel="icon" href="{{ self.asset("favicon.svg") }}" type="image/svg+xml">
  <link rel="icon" href="{{ self.asset("favicon-32.png") }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ self.asset("apple-touch-icon.png") }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="{{ self.asset("app.css") }}">
  <script src="{{ self.asset("app.js") }}" defer></script>
</head>
<body class="app-body public-body">
{% block body %}{% endblock %}
</body>
</html>
