<!doctype html>
<html lang="{{ lang.code() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} · {{ self.headline() }} · {{ self.t("app.title") }}</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ self.asset("favicon.svg") }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ self.asset("app.css") }}">
</head>
<body class="app-body">
  <main class="error-wrap">
    <div class="error-card">
      <a href="/" class="logo logo-center" aria-label="{{ self.t("app.title") }}">
        <span class="logo-mark"><svg class="icon" aria-hidden="true"><use href="{{ self.icon("wallet") }}"></use></svg></span>
        <span class="logo-text">{{ self.t("app.title") }}</span>
      </a>
      <p class="error-code">{{ status }}</p>
      <h1 class="error-title">{{ self.headline() }}</h1>
      <p class="error-hint">{{ self.hint() }}</p>
      {% if self.show_message() %}<p class="alert alert-error mt-4" role="alert">{{ message }}</p>{% endif %}
      <div class="error-actions">
        <a class="btn-primary" href="{% if signed_in %}{{ crate::web::START_PAGE }}{% else %}/{% endif %}">{{ self.t("error.home") }}</a>
      </div>
    </div>
  </main>
</body>
</html>
