{% extends "base.html" %}
{#- Обычная страница («О проекте» и т. п.): заголовок, вводный абзац из description, текст. -#}
{% block content %}
<div class="site-wrap site-narrow article">
  <h1 class="site-h1">{{ page.title }}</h1>
  {% if page.description %}<p class="article-lead">{{ page.description }}</p>{% endif %}
  <div class="prose">{{ page.content | safe }}</div>
</div>
{% endblock %}
