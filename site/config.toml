# Сайт «Семейного бюджета»: лендинг, блог (релизы, гайды, идеи), «О проекте», отзывы и правовые страницы.
# Сборка: `make site` (ассеты + zola build), разработка: `make site-serve`. Правила для статей — site/README.md.
#
# Все тексты — на трёх языках: русский (по умолчанию, без префикса), английский (/en/), тайский (/th/).
# Строки интерфейса — в [translations] ниже, у каждого языка один и тот же набор ключей (проверяет scripts/check_site.py).

# Будущий адрес. На GitHub Pages workflow site.yml подставляет адрес Pages через --base-url.
base_url = "https://family-budget-555.ru"
title = "Семейный бюджет"
description = "Общий и личный бюджет семьи на трёх языках"
default_language = "ru"
author = "Семейный бюджет"

compile_sass = false
minify_html = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "topics", feed = false }]

[markdown]
lazy_async_image = true
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = false
bottom_footnotes = true

[link_checker]
# Внешние ссылки проверяются только вручную (`zola check`): в CI сеть может быть недоступна.
skip_prefixes = ["https://family-budget-555.ru", "mailto:"]

[extra]
# Порядок языков в переключателе и hreflang.
langs = ["ru", "en", "th"]
# Пока сайт живёт отдельно от приложения (GitHub Pages): закрыт от индексации, чтобы не дублировать лендинг
# на family-budget-555.ru, и показывает плашку «предварительная версия». При переезде на основной домен — false.
preview = true
# Адрес приложения: «Войти», «Создать бюджет», «Посмотреть демо».
app_url = "https://family-budget-555.ru"
# Email для связи на правовых страницах и в «Отзывах». Пусто — показываем только GitHub Issues.
contact_email = ""
repo_url = "https://github.com/Yolshin195/family-budget"
# Комментарии под статьями: место в шаблонах заложено (templates/partials/comments.html), сервис выберем позже.
comments = false

