[workspace]
resolver = "3"
members = ["crates/kernel", "crates/app", "crates/features/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Внутренние крейты не публикуются: cargo deny не требует от них лицензии и версий у path-зависимостей.
publish = false

[workspace.dependencies]
kernel = { path = "crates/kernel" }
anyhow = "1"
askama = "0.16"
axum-extra = { version = "0.12", features = ["form"] }
async-trait = "0.1"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.8"
rust_decimal = { version = "1", features = ["serde-with-float"] }
# Rustls без aws-lc: тот же ring, что у sqlx и openidconnect (провайдер для отправки в Sentry ставит main).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Ошибки и паники → Sentry (или совместимый GlitchTip). Без native-tls/OpenSSL и без aws-lc.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider", "tracing", "tower-axum-matched-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev.package."*"]
opt-level = 1
