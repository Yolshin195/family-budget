[workspace]
resolver = "3"
members = ["crates/kernel", "crates/app", "crates/features/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Внутренние крейты не публикуются: cargo deny не требует от них лицензии и версий у path-зависимостей.
publish = false

[workspace.dependencies]
kernel = { path = "crates/kernel" }
anyhow = "1"
askama = "0.16"
axum-extra = { version = "0.12", features = ["form"] }
async-trait = "0.1"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.8"
# MCP-сервер (официальный Rust SDK): Streamable HTTP, макросы инструментов.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
rust_decimal = { version = "1", features = ["serde-with-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
# Сравнение названий без диакритики (kernel::search); уже в дереве зависимостей через sqlx.
unicode-normalization = "0.1"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "compression-gzip", "compression-br", "catch-panic"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev.package."*"]
opt-level = 1
