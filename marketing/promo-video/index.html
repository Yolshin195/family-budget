<!doctype html>
<!--
  Рекламный ролик для TikTok / Instagram Reels: 1080×1920, ~28 с, «боль → решение».
  Кадры — скриншоты гайдов сайта (site/content/guides/**/<имя>.<язык>.webp), язык — ?lang=ru|en|th.
  Анимации — Web Animations API; render.mjs ставит их на паузу и снимает покадрово через window.seek(t).
  В браузере без ?render страница проигрывается сама (удобно для предпросмотра).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Промо-ролик</title>
<style>
  @font-face { font-family: Inter; src: url(../../crates/app/static/inter-latin.woff2) format("woff2"); font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212, U+2215, U+0E3F; }
  @font-face { font-family: Inter; src: url(../../crates/app/static/inter-latin-ext.woff2) format("woff2"); font-weight: 100 900;
    unicode-range: U+0100-024F, U+20A0-20AB, U+20AD-20CF, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Inter; src: url(../../crates/app/static/inter-cyrillic.woff2) format("woff2"); font-weight: 100 900;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Noto Sans Thai"; src: url(../../crates/app/static/noto-sans-thai.woff2) format("woff2"); font-weight: 100 900; }

  :root {
    --accent: #4338ca; --accent-soft: #e0e7ff; --ink: #0f172a; --muted: #475569;
    --danger: #dc2626; --danger-soft: #fee2e2; --ok: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: Inter, "Noto Sans Thai", "Noto Color Emoji", sans-serif; color: var(--ink);
    background: linear-gradient(170deg, #eef2ff 0%, #f8fafc 45%, #fdf2f8 100%);
    -webkit-font-smoothing: antialiased; position: relative;
  }
  body.th { line-height: 1.3; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }

  /* Текстовый блок сцены «боль → решение» */
  .text { position: absolute; left: 60px; top: 230px; width: 960px; display: flex; flex-direction: column; gap: 26px; }
  .pain { align-self: flex-start; position: relative; }
  .pain-inner { display: flex; align-items: center; gap: 16px; padding: 18px 30px; border-radius: 999px;
    background: var(--danger-soft); color: #991b1b; font-size: 40px; font-weight: 600; }
  .strike { position: absolute; left: 22px; right: 22px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px;
    background: var(--danger); transform-origin: left center; }
  .title { display: flex; gap: 22px; align-items: flex-start; font-size: 78px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.08; }
  .th .title { font-size: 68px; letter-spacing: 0; line-height: 1.3; }
  .check { flex: none; width: 76px; height: 76px; margin-top: 6px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
  .sub { font-size: 38px; color: var(--muted); line-height: 1.3; font-weight: 500; padding-left: 98px; }

  /* Карточка со скриншотом */
  .card { position: absolute; top: 680px; border-radius: 32px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 80px -20px rgba(30, 27, 75, .35), 0 0 0 1px rgba(15, 23, 42, .06); }
  .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
  .layer img { display: block; width: 1280px; height: 800px; }
  .ring { position: absolute; border-radius: 14px; border: 4px solid var(--danger); box-shadow: 0 0 0 8px rgba(220, 38, 38, .18); }
  .ring.ok { border-color: var(--accent); box-shadow: 0 0 0 8px rgba(67, 56, 202, .18); }
  .typing { position: absolute; background: #fff; font-size: 30px; font-weight: 500; line-height: 48px; padding-left: 10px; white-space: nowrap; }
  .caret { display: inline-block; width: 2px; height: 32px; background: var(--accent); vertical-align: middle; margin-left: 2px; }

  /* Вступление */
  .hook { position: absolute; left: 60px; right: 60px; top: 620px; text-align: center; }
  .hook .l1 { font-size: 96px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; }
  .hook .l2 { font-size: 96px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; color: var(--accent); margin-top: 18px; }
  .th .hook .l1, .th .hook .l2 { font-size: 76px; letter-spacing: 0; line-height: 1.3; }
  .hook .q { display: inline-block; margin-top: 70px; padding: 20px 44px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 48px; font-weight: 700; }
  .money { position: absolute; font-size: 110px; }

  /* Чат с Claude */
  .chat { position: absolute; left: 70px; width: 940px; top: 650px; padding: 30px 30px 36px; border-radius: 36px; background: #fff;
    box-shadow: 0 40px 80px -20px rgba(30, 27, 75, .35), 0 0 0 1px rgba(15, 23, 42, .06); display: flex; flex-direction: column; gap: 22px; }
  .chat-head { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; padding-bottom: 18px; border-bottom: 2px solid #f1f5f9; }
  .spark { color: #d97757; font-size: 40px; }
  .msg { font-size: 31px; line-height: 1.35; padding: 20px 26px; border-radius: 30px; max-width: 760px; }
  .th .msg { line-height: 1.45; }
  .me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 8px; }
  .bot { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 8px; }
  .bot b { color: var(--ok); }
  .tool { align-self: flex-start; display: flex; align-items: center; gap: 12px; font-size: 26px; color: var(--muted);
    padding: 10px 20px; border-radius: 999px; border: 2px solid #e2e8f0; }
  .tool i { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .receipt { align-self: flex-end; width: 210px; padding: 16px 18px; background: #fffdf7; border-radius: 10px; transform: rotate(3deg);
    box-shadow: 0 10px 24px -8px rgba(15, 23, 42, .3); font-size: 18px; font-family: ui-monospace, monospace; color: #334155; }
  .receipt .h { text-align: center; font-weight: 700; font-size: 22px; margin-bottom: 8px; }
  .receipt .row { height: 8px; margin: 9px 0; border-radius: 4px; background: #e2e8f0; }
  .receipt .tot { display: flex; justify-content: space-between; border-top: 2px dashed #cbd5e1; padding-top: 8px; margin-top: 10px; font-weight: 700; }

  /* Финал */
  .cta { position: absolute; left: 60px; right: 60px; top: 520px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .cta img { width: 220px; height: 220px; border-radius: 48px; box-shadow: 0 30px 60px -20px rgba(67, 56, 202, .6); }
  .cta .name { margin-top: 48px; font-size: 92px; font-weight: 800; letter-spacing: -2px; }
  .th .cta .name { letter-spacing: 0; font-size: 84px; }
  .cta .tag { margin-top: 18px; font-size: 44px; color: var(--muted); font-weight: 500; }
  .cta .btn { margin-top: 70px; padding: 34px 56px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 46px; font-weight: 700;
    box-shadow: 0 24px 50px -16px rgba(67, 56, 202, .8); }
  .cta .url { margin-top: 44px; font-size: 46px; font-weight: 700; color: var(--accent); }
  .cta .langs { margin-top: 18px; font-size: 34px; color: var(--muted); }
</style>
</head>
<body>
<div class="blob" id="b1" style="width:700px;height:700px;left:-200px;top:-150px;background:#a5b4fc"></div>
<div class="blob" id="b2" style="width:600px;height:600px;right:-220px;top:900px;background:#f9a8d4"></div>
<div class="blob" id="b3" style="width:500px;height:500px;left:-120px;bottom:-160px;background:#c7d2fe"></div>
<script>
const LANG = new URLSearchParams(location.search).get('lang') || 'ru';
const RENDER = new URLSearchParams(location.search).has('render');
document.documentElement.lang = LANG;
document.body.classList.add(LANG);

// Тексты ролика — на трёх языках. Названия разделов — как в интерфейсе.
const T = {
  ru: {
    hook: ['Зарплата пришла…', '…и куда-то делась', 'Знакомо?'],
    scenes: [
      ['Записывать траты — долго и лень', 'Расход за 5 секунд', 'Сумма, категория, Enter — с любой страницы'],
      ['О перерасходе узнаёшь в конце месяца', 'Лимиты предупредят заранее', 'Факт, план и прогноз — сколько ещё можно потратить'],
      ['Опять забыли про аренду и подписки', 'Все платежи — в календаре', 'Видно заранее, просрочки — красным'],
      ['Каждый ведёт деньги в своих заметках', 'Один бюджет на всю семью', 'Пригласите ссылкой или QR-кодом, личное остаётся личным'],
      ['Карты, наличные, баты, рубли — каша', 'Все счета и валюты в одном месте', 'Остатки в базовой валюте, обмен — по реальному курсу'],
    ],
    claude: { pain: 'Нет времени даже открыть приложение', title: 'Просто скажите Claude — он запишет',
      receipt: 'Чек Big C', total: '3 110 ฿', q1: 'Запиши, платила картой SCB', tool: 'добавлен расход',
      a1: 'Готово: расход 3 110 ฿ с карты SCB.', q2: 'Сколько осталось на еду до конца месяца?',
      a2: ['На «Еду» осталось ', '4 820 ฿', ' из 18 000 ฿ — примерно 320 ฿ в день.'] },
    cta: { name: 'Семейный бюджет', tag: 'Деньги под контролем — всей семьёй', btn: 'Демо — без регистрации',
      langs: 'Русский · English · ไทย' },
  },
  en: {
    hook: ['Payday…', '…and where did it all go?', 'Sound familiar?'],
    scenes: [
      ['Logging expenses is a chore', 'An expense in 5 seconds', 'Amount, category, Enter — from any page'],
      ['You find out you overspent at month-end', 'Limits warn you early', 'Actual, plan and forecast — what’s left to spend'],
      ['Forgot the rent and subscriptions again', 'Every payment in the calendar', 'See them coming, overdue ones in red'],
      ['Everyone tracks money in their own notes', 'One budget for the whole family', 'Invite by link or QR code — personal stays personal'],
      ['Cards, cash, baht, roubles — a mess', 'All accounts and currencies in one place', 'Balances in your base currency, exchange at the real rate'],
    ],
    claude: { pain: 'No time to even open the app', title: 'Just tell Claude — it logs it for you',
      receipt: 'Big C receipt', total: '฿3,110', q1: 'Log this, I paid with the SCB card', tool: 'expense added',
      a1: 'Done: a ฿3,110 expense from the SCB card.', q2: 'How much is left for food this month?',
      a2: ['Food has ', '฿4,820', ' left of ฿18,000 — about ฿320 a day.'] },
    cta: { name: 'Family budget', tag: 'Money under control — together', btn: 'Try the demo — no sign-up',
      langs: 'Русский · English · ไทย' },
  },
  th: {
    hook: ['เงินเดือนออกแล้ว…', '…แล้วเงินหายไปไหน?', 'คุ้น ๆ ไหม?'],
    scenes: [
      ['จดรายจ่ายทีไร ยุ่งยากจนขี้เกียจ', 'บันทึกรายจ่ายใน 5 วินาที', 'จำนวนเงิน หมวดหมู่ กด Enter — ได้จากทุกหน้า'],
      ['รู้ว่าใช้เกินงบก็ตอนสิ้นเดือน', 'วงเงินเตือนล่วงหน้า', 'ยอดจริง แผน และคาดการณ์ — รู้ว่ายังใช้ได้อีกเท่าไร'],
      ['ลืมจ่ายค่าเช่ากับค่าสมาชิกอีกแล้ว', 'ทุกการชำระอยู่ในปฏิทิน', 'เห็นล่วงหน้า รายการเลยกำหนดเป็นสีแดง'],
      ['ต่างคนต่างจดเงินในโน้ตของตัวเอง', 'งบเดียวสำหรับทั้งครอบครัว', 'เชิญด้วยลิงก์หรือคิวอาร์โค้ด เรื่องส่วนตัวยังเป็นส่วนตัว'],
      ['บัตร เงินสด บาท รูเบิล — ปนกันวุ่น', 'ทุกบัญชีทุกสกุลเงินในที่เดียว', 'ยอดคงเหลือในสกุลเงินหลัก แลกเงินตามอัตราจริง'],
    ],
    claude: { pain: 'ไม่มีเวลาแม้แต่จะเปิดแอป', title: 'แค่บอก Claude แล้วจะบันทึกให้เอง',
      receipt: 'ใบเสร็จ Big C', total: '฿3,110', q1: 'บันทึกให้หน่อย จ่ายด้วยบัตร SCB', tool: 'เพิ่มรายจ่ายแล้ว',
      a1: 'เรียบร้อย: รายจ่าย ฿3,110 จากบัตร SCB', q2: 'เดือนนี้เหลืองบค่าอาหารเท่าไร?',
      a2: ['หมวดอาหารเหลือ ', '฿4,820', ' จาก ฿18,000 — ประมาณวันละ ฿320'] },
    cta: { name: 'งบประมาณครอบครัว', tag: 'คุมเงินไปด้วยกันทั้งครอบครัว', btn: 'ลองเดโม — ไม่ต้องสมัคร',
      langs: 'Русский · English · ไทย' },
  },
}[LANG];

// Кадры: скриншот, начальный и конечный вид (в координатах снимка 1280×800), подсветки и набор суммы.
const SHOTS = [
  { img: 'transactions/quick', aspect: 1.1, from: { x: 280, y: 70, w: 730 }, to: { x: 385, y: 150, w: 520 },
    rings: [{ x: 401, y: 183, w: 478, h: 64, at: 1.3, ok: true }], typing: { x: 410, y: 192, w: 300, h: 48, text: '350', at: 1.55 } },
  // Обзор: проезд по строкам таблицы от названий категорий к красной полосе перерасхода.
  { img: 'overview/overview', aspect: 1.3, from: { x: 268, y: 335, w: 600 }, to: { x: 662, y: 335, w: 600 },
    rings: [{ x: 990, y: 731, w: 256, h: 44, at: 2.6 }] },
  { img: 'calendar/calendar', aspect: 1.3, from: { x: 262, y: 110, w: 900 }, to: { x: 262, y: 354, w: 580 },
    rings: [{ x: 274, y: 581, w: 138, h: 47, at: 2.3 }, { x: 694, y: 581, w: 135, h: 47, at: 2.6 }] },
  { img: 'first-budget/family', aspect: 1.3, from: { x: 262, y: 30, w: 1000 }, to: { x: 760, y: 60, w: 500 },
    rings: [{ x: 776, y: 252, w: 468, h: 128, at: 2.4, ok: true }] },
  { img: 'accounts/accounts', aspect: 1.3, from: { x: 262, y: 60, w: 720 }, to: { x: 262, y: 90, w: 560 }, coins: true },
];

const HOOK = 2.4, SCENE = 3.8, CLAUDE = 4.8, CTA = 3.6, FADE = 0.3;
window.TOTAL = HOOK + SHOTS.length * SCENE + CLAUDE + CTA;
const EASE = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.45,0,.25,1)', POP = 'cubic-bezier(.34,1.56,.64,1)';

function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e);
  return e;
}
function anim(e, kf, start, dur, easing = EASE) {
  return e.animate(kf, { delay: start * 1000, duration: dur * 1000, fill: 'both', easing });
}
const pop = (e, t) => anim(e, [{ opacity: 0, transform: 'translateY(40px) scale(.9)' }, { opacity: 1, transform: 'none' }], t, 0.55, POP);
const rise = (e, t, d = 0.6) => anim(e, [{ opacity: 0, transform: 'translateY(50px)' }, { opacity: 1, transform: 'none' }], t, d);
function scene(start, dur, first, last) {
  const s = el('div', 'scene');
  // Новая сцена проявляется поверх уходящей (перекрёстная смена, без провала в пустой фон).
  const from = first ? start : start - FADE, len = start + dur - from, f = FADE / len;
  anim(s, [{ opacity: first ? 1 : 0 }, { opacity: 1, offset: first ? 0 : f }, { opacity: 1, offset: 1 - f / 2 }, { opacity: last ? 1 : 0 }], from, len, 'linear');
  return s;
}
const CHECK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

// Фон медленно «дышит» весь ролик.
anim(document.getElementById('b1'), [{ transform: 'translate(0,0)' }, { transform: 'translate(160px,120px)' }], 0, window.TOTAL, 'ease-in-out');
anim(document.getElementById('b2'), [{ transform: 'translate(0,0)' }, { transform: 'translate(-180px,-260px)' }], 0, window.TOTAL, 'ease-in-out');
anim(document.getElementById('b3'), [{ transform: 'translate(0,0)' }, { transform: 'translate(220px,-120px)' }], 0, window.TOTAL, 'ease-in-out');

// 1. Вступление — боль.
{
  const s = scene(0, HOOK, true);
  const h = el('div', 'hook', s);
  pop(el('div', 'l1', h, T.hook[0]), 0.1);
  pop(el('div', 'l2', h, T.hook[1]), 0.6);
  pop(el('div', 'q', h, T.hook[2]), 1.25);
  const spots = [[90, 1500, -20], [820, 1560, 25], [300, 1700, 10], [640, 1680, -15], [900, 1300, 30], [60, 1250, -30], [480, 1520, 5]];
  spots.forEach(([x, y, r], i) => {
    const m = el('div', 'money', s, '💸');
    m.style.left = x + 'px'; m.style.top = y + 'px';
    anim(m, [{ opacity: 0, transform: `translateY(0) rotate(${r}deg)` }, { opacity: 1, offset: .2 },
      { opacity: 0, transform: `translateY(-1300px) rotate(${-r * 2}deg)` }], 0.7 + i * 0.12, 1.6, 'cubic-bezier(.4,0,.6,1)');
  });
}

// 2–6. Боль → решение со скриншотом.
SHOTS.forEach((shot, i) => {
  const start = HOOK + i * SCENE;
  const [painText, titleText, subText] = T.scenes[i];
  const s = scene(start, SCENE);
  const txt = el('div', 'text', s);
  const pain = el('div', 'pain', txt);
  const painInner = el('div', 'pain-inner', pain, '😩 ' + painText);
  const strike = el('div', 'strike', pain);
  anim(pain, [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], start + 0.05, 0.45, POP);
  anim(strike, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], start + 1.1, 0.35);
  anim(painInner, [{ opacity: 1 }, { opacity: .6 }], start + 1.2, 0.3);
  const title = el('div', 'title', txt, `<span class="check">${CHECK}</span><span>${titleText}</span>`);
  rise(title, start + 1.25);
  rise(el('div', 'sub', txt, subText), start + 1.45);

  const H = Math.min(780, 960 / shot.aspect), W = H * shot.aspect;
  const card = el('div', 'card', s);
  Object.assign(card.style, { width: W + 'px', height: H + 'px', left: (1080 - W) / 2 + 'px' });
  anim(card, [{ opacity: 0, transform: 'translateY(240px) scale(.94)' }, { opacity: 1, transform: 'none' }], start + 0.3, 0.7);
  const layer = el('div', 'layer', card, `<img src="../../site/content/guides/${shot.img}.${LANG}.webp">`);
  const view = v => `scale(${W / v.w}) translate(${-v.x}px, ${-v.y}px)`;
  anim(layer, [{ transform: view(shot.from) }, { transform: view(shot.to) }], start + 1.2, SCENE - 1.4, INOUT);

  (shot.rings || []).forEach(r => {
    const ring = el('div', 'ring' + (r.ok ? ' ok' : ''), layer);
    Object.assign(ring.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    anim(ring, [{ opacity: 0, transform: 'scale(1.25)' }, { opacity: 1, transform: 'none' }], start + r.at, 0.4, POP);
  });
  if (shot.typing) {
    const ty = shot.typing;
    const box = el('div', 'typing', layer);
    Object.assign(box.style, { left: ty.x + 'px', top: ty.y + 'px', width: ty.w + 'px', height: ty.h + 'px' });
    anim(box, [{ opacity: 0 }, { opacity: 1 }], start + ty.at - 0.05, 0.05, 'linear');
    [...ty.text].forEach((ch, k) => anim(el('span', '', box, ch), [{ opacity: 0 }, { opacity: 1 }], start + ty.at + k * 0.22, 0.01, 'linear'));
    const caret = el('span', 'caret', box);
    anim(caret, [{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0, offset: .5 }, { opacity: 0 }], start + ty.at, 0.8, 'linear')
      .effect.updateTiming({ iterations: 4 });
  }
  if (shot.coins) {
    [['฿', 70, 1560, '#059669'], ['₽', 470, 1600, '#4338ca'], ['$', 860, 1540, '#d97706']].forEach(([c, x, y, color], k) => {
      const coin = el('div', 'abs', s, c);
      Object.assign(coin.style, { left: x + 'px', top: y + 'px', width: '150px', height: '150px', borderRadius: '50%', background: '#fff',
        color, fontSize: '84px', fontWeight: 800, display: 'grid', placeItems: 'center', boxShadow: '0 20px 40px -12px rgba(15,23,42,.3)' });
      pop(coin, start + 1.7 + k * 0.2);
      anim(coin, [{ translate: '0 0' }, { translate: '0 -30px' }], start + 1.7, SCENE - 1.7, 'ease-in-out');
    });
  }
});

// 7. Claude: голосом и по фото чека.
{
  const start = HOOK + SHOTS.length * SCENE, C = T.claude;
  const s = scene(start, CLAUDE);
  const txt = el('div', 'text', s);
  const pain = el('div', 'pain', txt);
  const painInner = el('div', 'pain-inner', pain, '⏳ ' + C.pain);
  const strike = el('div', 'strike', pain);
  anim(pain, [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], start + 0.05, 0.45, POP);
  anim(strike, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], start + 1.0, 0.35);
  anim(painInner, [{ opacity: 1 }, { opacity: .6 }], start + 1.1, 0.3);
  rise(el('div', 'title', txt, `<span class="check">${CHECK}</span><span>${C.title}</span>`), start + 1.15);

  const chat = el('div', 'chat', s);
  rise(chat, start + 0.3, 0.7);
  el('div', 'chat-head', chat, '<span class="spark">✳</span> Claude');
  const items = [
    el('div', 'receipt', chat, `<div class="h">${C.receipt}</div><div class="row"></div><div class="row" style="width:70%"></div><div class="row"></div><div class="row" style="width:55%"></div><div class="tot"><span>Σ</span><span>${C.total}</span></div>`),
    el('div', 'msg me', chat, C.q1),
    el('div', 'tool', chat, `<i></i> add_expense · ${C.tool}`),
    el('div', 'msg bot', chat, C.a1),
    el('div', 'msg me', chat, C.q2),
    el('div', 'msg bot', chat, `${C.a2[0]}<b>${C.a2[1]}</b>${C.a2[2]}`),
  ];
  [1.0, 1.35, 1.9, 2.2, 2.9, 3.5].forEach((t, k) => pop(items[k], start + t));
}

// 8. Призыв.
{
  const start = HOOK + SHOTS.length * SCENE + CLAUDE, C = T.cta;
  const s = scene(start, CTA, false, true);
  const box = el('div', 'cta', s);
  const logo = el('img', '', box);
  logo.src = '../../crates/app/static/favicon.svg';
  pop(logo, start + 0.1);
  rise(el('div', 'name', box, C.name), start + 0.35);
  rise(el('div', 'tag', box, C.tag), start + 0.55);
  const btn = el('div', 'btn', box, C.btn + ' →');
  pop(btn, start + 0.9);
  anim(btn, [{ scale: 1 }, { scale: 1.06 }, { scale: 1 }], start + 1.6, 0.9, 'ease-in-out').effect.updateTiming({ iterations: 2 });
  rise(el('div', 'url', box, 'family-budget-555.ru'), start + 1.15);
  rise(el('div', 'langs', box, C.langs), start + 1.35);
}

window.seek = t => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.decode().catch(() => { throw new Error('нет кадра: ' + img.src); })));
  if (RENDER) window.seek(0);
})();
</script>
</body>
</html>
